[build]
publish = "."
# Los guardados del admin (menu-data.json e Images/) no redespliegan: el sitio los lee directo de GitHub
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)menu-data.json' ':(exclude)Images'"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/*.css"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/*.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/*.json"
[headers.values]
Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
for = "/Images/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
